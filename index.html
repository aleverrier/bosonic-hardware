:root[data-theme=&quot;light&quot;] {

* {

    --background,

h3,
h4,
h5,
h6,

h3,

h5,

}

b,
strong,

}

}

.table :is(th, td):last-child {

}

}

.table thead th {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

}

.card {

  corner-shape: var(--corner-shape);
